stages:
  - tests
  - e2e
  - release

test:
  image: python:$VERSION
  needs: []
  stage: tests
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    UV_PYTHON: $VERSION
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v.*$/
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --locked
  script:
    - uv run ruff format --check
    - uv run ruff check
    - uv run pytest
  parallel:
    matrix:
      - VERSION: ["3.13"]

# tests/e2e against MSS and the backends, all running natively, seeded from the frontend's fixtures
e2e:
  needs: []
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  stage: e2e
  variables:
    UV_PYTHON: "3.13"
    # the packages the four environments install, jax, qiskit and quantify among them, kept
    # between runs rather than downloaded each time
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    FRONTEND_REPO: "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/tergite-frontend.git"
    BACKEND_REPO: "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/tergite-backend.git"
    # this branch, tag or merge request's source branch, where the other repos have one of that name
    FRONTEND_BRANCH: $CI_COMMIT_REF_NAME
    BACKEND_BRANCH: $CI_COMMIT_REF_NAME
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v.*$/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl gnupg git
    - curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc |
      gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
    - echo "deb [ signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] http://repo.mongodb.org/apt/debian bookworm/mongodb-org/8.0 main" >
      /etc/apt/sources.list.d/mongodb-org-8.0.list
    - apt-get update -qq && apt-get install -y -qq mongodb-org
  script:
    - ./dev/e2e_native_test.sh
  cache:
    key: "uv-cache-e2e"
    paths:
      - .cache/uv
  artifacts:
    when: on_failure
    paths:
      - temp-native/logs/
    expire_in: 1 week

deploy staging:
  stage: release
  needs:
    - test
    - e2e
  environment: staging
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  rules:
    - if: $SHOULD_PUBLISH_TO_STAGING == "true" && $CI_COMMIT_TAG =~ /^v.*$/
  script:
    - uv build
    - uv publish
      --publish-url https://test.pypi.org/legacy/
      --check-url https://test.pypi.org/simple/
      --token "$TEST_PYPI_API_TOKEN"

deploy production:
  stage: release
  needs:
    - test
    - e2e
  environment: production
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  rules:
    - if: $SHOULD_PUBLISH_TO_PROD == "true" && $CI_COMMIT_TAG =~ /^v.*$/
  script:
    - uv build
    - uv publish --check-url https://pypi.org/simple/ --token "$PYPI_API_TOKEN"
