[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tergite"
authors = [
    { name = "Miroslav Dobsicek" },
    { name = "Axel Andersson" },
    { name = "Martin Ahindura" },
    { name = "Stefan Hill" },
    { name = "Abdullah-al Amin" },
    { name = "Adilet Tuleuov" },
]
maintainers = [
    {name = "Chalmers Next Labs AB", email = "contact@quantum.chalmersnextlabs.se"}
]
version = "2026.11.0-rc.2"
description = "The SDK in the Tergite software stack for connecting to the Swedish quantum computer"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["quantum-computer", "qiskit", "quantum", "tergite", "sdk"]
license = {file = "LICENSE.txt"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "qiskit>=2.1,<3",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# writing pulse-level jobs with oqpy, and the backend's frames as oqpy frames
pulse = ["oqpy>=0.3.11,<0.4"]

[dependency-groups]
dev = [
    "pytest>=7.4.2",
    "pytest-xdist>=3.6",
    "scikit-learn~=1.7.0",
    # formats, sorts the imports and finds what pyflakes did
    "ruff==0.15.1",
    "pytest-benchmark>=5.1",
    "psutil>=7.0",
    "datamodel-code-generator>=0.34",
    "respx>=0.22",
    "h5py>=3.8.0",
    "oqpy>=0.3.11,<0.4",
]

[project.urls]
Homepage = "https://github.com/tergite/tergite"
Repository = "https://github.com/tergite/tergite"
Documentation = "https://github.com/tergite/tergite"
Issues = "https://github.com/tergite/tergite/issues"
Changelog = "https://github.com/tergite/tergite/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["tergite"]

[tool.ruff]
target-version = "py313"
# the example scripts and notebooks, which black and isort left alone too
extend-exclude = ["examples"]

[tool.ruff.lint]
# pyflakes' findings and isort's order, as black, isort and pyflakes checked before
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["tergite", "tests", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# so that dev/perf can import the tests' utilities
pythonpath = ["."]
markers = [
  "e2e: end-to-end tests",
  "integration: integration tests",
]
# what Qiskit or another dependency deprecates is moved off as it is deprecated
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]
