name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        default: 'release'
        type: choice
        options:
          - release
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked
      - name: Lint
        run: |
          uv run black --check tergite tests dev
          uv run isort --check-only tergite tests dev
          uv run pyflakes tergite tests dev
      - name: Run tests
        run: uv run pytest

  e2e:
    # noble, as the MongoDB repository below names it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install MongoDB
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc |
            sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" |
            sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org
      - name: Run end-to-end-tests
        env:
          DEBUG: ${{ vars.DEBUG || 'false' }}
          FRONTEND_REPO: https://github.com/${{ vars.REPO_OWNER || github.repository_owner }}/tergite-frontend.git
          BACKEND_REPO: https://github.com/${{ vars.REPO_OWNER || github.repository_owner }}/tergite-backend.git
          # a pull request's source branch, as its ref_name is N/merge
          FRONTEND_BRANCH: ${{ github.head_ref || github.ref_name }}
          BACKEND_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: ./dev/e2e_native_test.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: temp-native/logs/

  release:
    name: Release
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/') || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'release')
    needs: tests
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Publish to Test pypi
        if: ${{ vars.SHOULD_PUBLISH_TO_STAGING == 'true' }}
        run: |
          uv publish \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/ \
            --token ${{ secrets.TEST_PYPI_API_TOKEN }}
      - name: Publish to pypi
        if: ${{ vars.SHOULD_PUBLISH_TO_PROD == 'true' }}
        run: |
          uv publish \
            --check-url https://pypi.org/simple/ \
            --token ${{ secrets.PYPI_API_TOKEN }}
