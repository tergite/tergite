name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        default: 'e2e'
        type: choice
        options:
          - e2e
          - release
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked
      - name: Lint
        run: |
          uv run black --check tergite tests
          uv run isort --check-only tergite tests
          uv run pyflakes tergite tests
      - name: Run tests
        run: uv run pytest

  e2e:
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/heads/main') || 
      startsWith(github.ref, 'refs/tags/') || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'e2e')
    needs: tests
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
        with:
          version: 'latest'
      - name: Run end-to-end-tests
        env:
          DEBUG: ${{ vars.DEBUG || 'false' }}
          FRONTEND_REPO: https://github.com/${{ vars.REPO_OWNER || github.repository_owner }}/tergite-frontend.git
          BACKEND_REPO: https://github.com/${{ vars.REPO_OWNER || github.repository_owner }}/tergite-backend.git
          BACKEND_BRANCH: ${{ github.ref_name }}
          FRONTEND_BRANCH: ${{ github.ref_name }}
          PYTHON_IMAGE: python:${{ matrix.python-version }}-slim
        run: ./e2e_test.sh
#      - name: Dump container logs on failure
#        if: always()
#        run: |
#          for container in $(docker ps -a --filter "name=tergite-e2e" --format "{{.Names}}"); do
#            echo "===== $container ====="
#            docker logs "$container" 2>&1 || true
#          done

  release:
    name: Release
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/') || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'release')
    needs: tests
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Publish to Test pypi
        if: ${{ vars.SHOULD_PUBLISH_TO_STAGING == 'true' }}
        run: |
          uv publish \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/ \
            --token ${{ secrets.TEST_PYPI_API_TOKEN }}
      - name: Publish to pypi
        if: ${{ vars.SHOULD_PUBLISH_TO_PROD == 'true' }}
        run: |
          uv publish \
            --check-url https://pypi.org/simple/ \
            --token ${{ secrets.PYPI_API_TOKEN }}
